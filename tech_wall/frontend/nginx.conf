server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # =========================================
    # Security Headers
    # =========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # =========================================
    # Gzip Compression
    # =========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # =========================================
    # SPA com base path /techwall/
    # =========================================
    location /techwall/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /techwall/index.html;

        # Assets estáticos com hash do Vite — cache agressivo
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # Redireciona /techwall (sem trailing slash) para /techwall/
    location = /techwall {
        return 301 /techwall/;
    }

    # Redireciona a raiz para /techwall/
    location = / {
        return 301 /techwall/;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Logs para stdout/stderr para visualização com `docker logs`
    error_log /dev/stderr;
    access_log /dev/stdout;
}
